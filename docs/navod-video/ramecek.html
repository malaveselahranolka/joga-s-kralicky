<!doctype html>
<html lang="cs">
<head>
<meta charset="utf-8">
<title>Rámeček videa</title>
<!-- Rámeček kolem nahrávky webu: seznam kroků vlevo, telefon vpravo.
     Plátno 540 × 675 CSS px, snímá se s deviceScaleFactor 2 → 1080 × 1350
     (Instagram příspěvek 4:5). Obrazovka telefonu je PRŮHLEDNÁ díra, pod
     kterou slozit.mjs podloží nahrávku. Stav se počítá z času: seek(t). -->
<style>
  @font-face { font-family: "Hanken Grotesk"; font-weight: 400 700; src: url("../../assets/fonts/hanken-grotesk-latin-ext.woff2") format("woff2"); unicode-range: U+0100-02AF; }
  @font-face { font-family: "Hanken Grotesk"; font-weight: 400 700; src: url("../../assets/fonts/hanken-grotesk-latin.woff2") format("woff2"); unicode-range: U+0000-00FF, U+2000-206F; }
  @font-face { font-family: "Schibsted Grotesk"; font-weight: 400 700; src: url("../../assets/fonts/schibsted-grotesk-latin-ext.woff2") format("woff2"); unicode-range: U+0100-02AF; }
  @font-face { font-family: "Schibsted Grotesk"; font-weight: 400 700; src: url("../../assets/fonts/schibsted-grotesk-latin.woff2") format("woff2"); unicode-range: U+0000-00FF, U+2000-206F; }
  :root { --forest: #2C3B2E; --ink: #1E231C; --soft: #6B7166; --cream: #F1EEE5; --paper: #F7F4EC; --accent: #D2854A; --clover: #6E8A4E; }
  * { box-sizing: border-box; }
  html, body { margin: 0; width: 540px; height: 675px; overflow: hidden; background: transparent; }
  #stage { position: relative; width: 540px; height: 675px; overflow: hidden; font-family: "Hanken Grotesk", sans-serif; color: var(--ink); }

  /* průhledná díra = obrazovka telefonu; stín o velkém rozsahu natře zbytek */
  .hole { position: absolute; border-radius: 30px; box-shadow: 0 0 0 1400px var(--cream); }
  .bezel { position: absolute; border-radius: 40px; border: 8px solid var(--forest); box-shadow: 0 26px 50px -18px rgba(30,35,28,.45); }
  .chrome { position: absolute; background: #fff; border-radius: 30px 30px 0 0; }
  .status { height: 22px; display: flex; justify-content: space-between; align-items: center; padding: 4px 20px 0; font: 700 10px "Schibsted Grotesk"; }
  .status .isl { width: 70px; height: 16px; border-radius: 10px; background: var(--forest); }
  .status .ic { display: flex; gap: 3px; align-items: center; } .status .ic b { width: 2.5px; height: 7px; background: var(--ink); border-radius: 1px; } .status .ic i { width: 13px; height: 7px; border: 1.3px solid var(--ink); border-radius: 2px; }
  .url { margin: 3px 12px 0; height: 22px; border-radius: 11px; background: #EFEFEF; display: flex; align-items: center; justify-content: center; gap: 5px; font: 600 10.5px -apple-system, "Hanken Grotesk", sans-serif; color: #222; }
  .url svg { width: 9px; height: 9px; }

  /* levý sloupec */
  .left { position: absolute; left: 26px; top: 40px; width: 176px; }
  .brand { display: flex; align-items: center; gap: 8px; font: 700 12px "Schibsted Grotesk"; color: var(--forest); }
  .brand img { width: 24px; height: 24px; }
  .title { font: 700 25px/1.08 "Schibsted Grotesk"; color: var(--forest); letter-spacing: -.02em; margin: 16px 0 18px; }
  .steps { list-style: none; margin: 0; padding: 0; }
  .steps li { display: flex; gap: 9px; align-items: flex-start; padding: 5px 0; color: #9A9D93; font-size: 11.5px; line-height: 1.3; font-weight: 600; }
  .steps li .n { flex: none; width: 19px; height: 19px; border-radius: 50%; border: 1.5px solid #C9C5B8; display: flex; align-items: center; justify-content: center; font: 700 9.5px "Schibsted Grotesk"; color: #9A9D93; }
  .steps li.done { color: var(--soft); }
  .steps li.done .n { background: var(--clover); border-color: var(--clover); color: #fff; font-size: 0; }
  .steps li.done .n::after { content: ""; width: 8px; height: 4px; border-left: 2px solid #fff; border-bottom: 2px solid #fff; transform: translateY(-1px) rotate(-45deg); }
  .steps li.cur { color: var(--forest); font: 700 15.5px/1.22 "Schibsted Grotesk"; padding: 8px 10px 9px 8px; margin: 3px -10px 3px -8px; border-radius: 12px; background: #fff; box-shadow: 0 6px 18px -8px rgba(30,35,28,.28); }
  .steps li.cur .n { width: 23px; height: 23px; background: var(--accent); border-color: var(--accent); color: #fff; font-size: 11px; }
  .steps li.cur small { display: block; margin-top: 4px; font: 500 10.5px/1.35 "Hanken Grotesk"; color: var(--soft); }
  .steps li:not(.cur) small { display: none; }
  .site { position: absolute; left: 26px; bottom: 30px; font: 700 12.5px "Schibsted Grotesk"; color: var(--forest); }
  .site span { display: block; font: 500 10.5px "Hanken Grotesk"; color: var(--soft); margin-bottom: 3px; }

  /* závěr */
  .end { position: absolute; inset: 0; background: var(--cream); display: flex; flex-direction: column; align-items: center; justify-content: center; text-align: center; padding: 40px 56px; opacity: 0; }
  .end .lc { width: 96px; height: 96px; border-radius: 50%; background: #fff; border: 3px solid var(--forest); display: flex; align-items: center; justify-content: center; }
  .end .lc img { width: 64px; height: 64px; }
  .end h2 { font: 700 32px/1.1 "Schibsted Grotesk"; color: var(--forest); margin: 22px 0 10px; letter-spacing: -.02em; }
  .end p { font-size: 14.5px; line-height: 1.5; color: var(--soft); margin: 0 0 22px; }
  .end .u { font: 700 17px "Schibsted Grotesk"; color: var(--paper); background: var(--forest); padding: 12px 24px; border-radius: 999px; }
</style>
</head>
<body>
<div id="stage">
  <div class="hole" id="hole"></div>
  <div class="chrome" id="chrome">
    <div class="status"><span>9:41</span><span class="isl"></span><span class="ic"><b></b><b></b><i></i></span></div>
    <div class="url" id="url"></div>
  </div>
  <div class="bezel" id="bezel"></div>
  <div class="left">
    <div class="brand"><img src="../../assets/logo.svg" alt="">Jóga s králíčky</div>
    <div class="title" id="title"></div>
    <ol class="steps" id="steps"></ol>
  </div>
  <div class="site"><span>Víc na webu</span>jogaskralicky.cz</div>
  <div class="end" id="end"><div class="lc"><img src="../../assets/logo.svg" alt=""></div><h2 id="endH"></h2><p id="endP"></p><div class="u" id="endU"></div></div>
</div>
<script>
  // window.DATA: { title, steps: [[text, sub]], events: [{t, typ, n|v}], endAt, end: {h, p, u}, screen: {x, y, w, h} }
  const D = window.DATA;
  const $ = (id) => document.getElementById(id);
  const S = D.screen, CH = 50, B = 8;
  Object.assign($('hole').style, { left: S.x + 'px', top: S.y + 'px', width: S.w + 'px', height: S.h + 'px', borderRadius: '0 0 30px 30px' });
  Object.assign($('chrome').style, { left: S.x + 'px', top: (S.y - CH) + 'px', width: S.w + 'px', height: CH + 'px' });
  Object.assign($('bezel').style, { left: (S.x - B) + 'px', top: (S.y - CH - B) + 'px', width: (S.w + 2 * B) + 'px', height: (S.h + CH + 2 * B) + 'px' });
  $('title').innerHTML = D.title;
  $('steps').innerHTML = D.steps.map((s, i) => '<li><span class="n">' + (i + 1) + '</span><span>' + s[0] + (s[1] ? '<small>' + s[1] + '</small>' : '') + '</span></li>').join('');
  $('endH').innerHTML = D.end.h; $('endP').textContent = D.end.p; $('endU').textContent = D.end.u;
  const lis = [...document.querySelectorAll('.steps li')];
  const lock = '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="3"><rect x="5" y="11" width="14" height="10" rx="2"/><path d="M8 11V8a4 4 0 0 1 8 0v3"/></svg>';
  const mail = '<svg viewBox="0 0 24 24" fill="none" stroke="#0A6CFF" stroke-width="2.6"><rect x="3" y="5" width="18" height="14" rx="2"/><path d="m3 7 9 6 9-6"/></svg>';
  const clamp = (x) => Math.max(0, Math.min(1, x));
  let lastUrl = null;
  window.seek = (t) => {
    let cur = 0, tCur = -9, url = '';
    for (const e of D.events) {
      if (e.t > t) break;
      if (e.typ === 'krok') { cur = e.n; tCur = e.t; }
      if (e.typ === 'adresa') url = e.v;
    }
    const p = clamp((t - tCur) / .35);
    lis.forEach((li, i) => {
      li.className = i + 1 < cur ? 'done' : (i + 1 === cur ? 'cur' : '');
      li.style.opacity = i + 1 === cur ? .35 + .65 * p : '';
      li.style.transform = i + 1 === cur ? `translateX(${(1 - p) * -6}px)` : '';
    });
    if (url !== lastUrl) {
      $('url').innerHTML = url === 'posta' ? mail + '<span style="color:#0A6CFF">Pošta</span>' : (url ? lock + url : '');
      $('url').style.visibility = url ? 'visible' : 'hidden';
      lastUrl = url;
    }
    const e = clamp((t - D.endAt) / .7);
    $('end').style.opacity = e;
    [...$('end').children].forEach((k, i) => {
      const q = clamp((t - D.endAt - .25 - i * .12) / .6);
      k.style.opacity = q; k.style.transform = `translateY(${(1 - q) * 14}px)`;
    });
  };
  window.seek(0);
</script>
</body>
</html>
