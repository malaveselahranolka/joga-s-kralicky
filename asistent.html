<!DOCTYPE html>
<html lang="cs">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0, interactive-widget=resizes-content" />
<link rel="preload" href="/assets/fonts/schibsted-grotesk-latin.woff2" as="font" type="font/woff2" crossorigin />
<link rel="preload" href="/assets/fonts/schibsted-grotesk-latin-ext.woff2" as="font" type="font/woff2" crossorigin />
<link rel="preload" href="/assets/fonts/hanken-grotesk-latin.woff2" as="font" type="font/woff2" crossorigin />
<link rel="preload" href="/assets/fonts/hanken-grotesk-latin-ext.woff2" as="font" type="font/woff2" crossorigin />
<title>AI asistent — Jóga s králíčky</title>
<meta name="description" content="Zeptejte se AI asistenta Jógy s králíčky na lekce, dárkový poukaz nebo cestu do studia v Ostravě." />
<link rel="canonical" href="https://www.jogaskralicky.cz/asistent.html" />
<!-- Chat není obsah pro vyhledávače, jen nástroj. -->
<meta name="robots" content="noindex, follow" />
<link rel="icon" type="image/svg+xml" href="assets/logo.svg" />
<meta name="theme-color" content="#F1EEE5" />
<!-- =====================================================================
     AI ASISTENT — samostatná stránka místo okna přes web
     Chat v okně přes stránku (overlay) se na telefonu s klávesnicí pořád
     někde posouval a propadal. Tady nic neleží přes nic: obsah teče shora
     dolů, pole na psaní je na konci jako u obyčejného formuláře, žádné
     position: fixed. Klávesnici si telefon zařídí sám. Křížek vrátí
     prohlížeč o krok zpět, takže je člověk na původní stránce na stejném
     místě, kde byl.
     Lišta souhlasu s měřením (souhlas.js) se tu schválně nenačítá — seděla
     by přes pole na psaní. Otevření chatu se měří už kliknutím na bublinu.
     ===================================================================== -->
<style>
  @font-face { font-family: "Hanken Grotesk"; font-style: normal; font-weight: 400 700; font-display: swap; src: url("/assets/fonts/hanken-grotesk-latin.woff2") format("woff2"); unicode-range: U+0000-00FF, U+0131, U+0152-0153, U+02BB-02BC, U+02C6, U+02DA, U+02DC, U+0304, U+0308, U+0329, U+2000-206F, U+20AC, U+2122, U+2191, U+2193, U+2212, U+2215, U+FEFF, U+FFFD; }
  @font-face { font-family: "Hanken Grotesk"; font-style: normal; font-weight: 400 700; font-display: swap; src: url("/assets/fonts/hanken-grotesk-latin-ext.woff2") format("woff2"); unicode-range: U+0100-02BA, U+02BD-02C5, U+02C7-02CC, U+02CE-02D7, U+02DD-02FF, U+0304, U+0308, U+0329, U+1D00-1DBF, U+1E00-1E9F, U+1EF2-1EFF, U+2020, U+20A0-20AB, U+20AD-20C0, U+2113, U+2C60-2C7F, U+A720-A7FF; }
  @font-face { font-family: "Schibsted Grotesk"; font-style: normal; font-weight: 400 700; font-display: swap; src: url("/assets/fonts/schibsted-grotesk-latin.woff2") format("woff2"); unicode-range: U+0000-00FF, U+0131, U+0152-0153, U+02BB-02BC, U+02C6, U+02DA, U+02DC, U+0304, U+0308, U+0329, U+2000-206F, U+20AC, U+2122, U+2191, U+2193, U+2212, U+2215, U+FEFF, U+FFFD; }
  @font-face { font-family: "Schibsted Grotesk"; font-style: normal; font-weight: 400 700; font-display: swap; src: url("/assets/fonts/schibsted-grotesk-latin-ext.woff2") format("woff2"); unicode-range: U+0100-02BA, U+02BD-02C5, U+02C7-02CC, U+02CE-02D7, U+02DD-02FF, U+0304, U+0308, U+0329, U+1D00-1DBF, U+1E00-1E9F, U+1EF2-1EFF, U+2020, U+20A0-20AB, U+20AD-20C0, U+2113, U+2C60-2C7F, U+A720-A7FF; }

  :root {
    --paper: #F1EEE5; --cream: #F7F4EC; --surface: #FFFFFF;
    --ink: #1E231C; --ink-soft: #5C6357;
    --forest: #2C3B2E; --forest-deep: #1E2920; --clover: #6E8A4E;
    --line: #E3DFD3;
  }
  *, *::before, *::after { box-sizing: border-box; }
  html { -webkit-text-size-adjust: 100%; }
  body {
    margin: 0; min-height: 100vh; min-height: 100dvh;
    display: flex; flex-direction: column;
    font-family: "Hanken Grotesk", system-ui, sans-serif; color: var(--ink); background: var(--paper);
    -webkit-font-smoothing: antialiased;
  }
  a { color: inherit; }

  /* hlavička: jen logo, název a zavřít */
  .as-head {
    position: sticky; top: 0; z-index: 2;
    display: flex; align-items: center; gap: .65rem;
    padding: .7rem .5rem .7rem 1rem; padding-top: max(.7rem, env(safe-area-inset-top));
    background: var(--paper); border-bottom: 1px solid var(--line);
  }
  .as-head img { width: 32px; height: 32px; flex: none; }
  .as-head h1 { margin: 0; font-family: "Schibsted Grotesk", system-ui, sans-serif; font-size: 1.05rem; font-weight: 600; letter-spacing: -.01em; }
  .as-x {
    margin-left: auto; width: 44px; height: 44px; border-radius: 999px;
    display: grid; place-items: center; color: var(--ink); text-decoration: none;
    -webkit-tap-highlight-color: transparent;
  }
  .as-x:hover { background: rgba(30,41,32,.07); }
  .as-x:focus-visible { outline: 2px solid var(--clover); outline-offset: -2px; }

  .as-main { flex: 1; width: 100%; max-width: 720px; margin: 0 auto; display: flex; flex-direction: column; }
  .as-log { flex: 1; padding: 1rem; display: flex; flex-direction: column; gap: .6rem; }
  .as-m { max-width: 86%; padding: .65rem .9rem; border-radius: 18px; font-size: 1rem; line-height: 1.5; white-space: pre-wrap; overflow-wrap: anywhere; }
  .as-m.bot { align-self: flex-start; background: var(--surface); border: 1px solid var(--line); border-bottom-left-radius: 6px; }
  .as-m.ja { align-self: flex-end; background: var(--forest); color: var(--cream); border-bottom-right-radius: 6px; }
  .as-m.chyba { background: #FBF1E8; border-color: #EBCFB6; }
  .as-m a { color: var(--forest); text-decoration: underline; text-underline-offset: 2px; font-weight: 600; }
  .as-dots { display: inline-flex; gap: 4px; padding: .2rem 0; }
  .as-dots i { width: 7px; height: 7px; border-radius: 50%; background: var(--clover); animation: asDot 1.1s infinite ease-in-out; }
  .as-dots i:nth-child(2) { animation-delay: .15s; } .as-dots i:nth-child(3) { animation-delay: .3s; }
  @keyframes asDot { 0%, 80%, 100% { opacity: .25; transform: translateY(0); } 40% { opacity: 1; transform: translateY(-3px); } }

  .as-chips { display: flex; flex-wrap: wrap; gap: .45rem; padding: 0 1rem .7rem; }
  .as-chips:empty { display: none; }
  .as-chips button {
    min-height: 40px; padding: .45rem .9rem; border-radius: 999px; border: 1px solid var(--line);
    background: var(--surface); color: var(--ink); font: 500 .9rem/1.2 "Hanken Grotesk", system-ui, sans-serif;
    cursor: pointer; touch-action: manipulation;
  }
  .as-chips button:hover { border-color: var(--forest); }

  /* pole na psaní: v normálním toku stránky, žádné fixed ani sticky */
  .as-form { display: flex; gap: .5rem; align-items: flex-end; padding: .7rem .8rem .35rem; border-top: 1px solid var(--line); background: var(--cream); }
  .as-form textarea {
    flex: 1; min-height: 44px; max-height: 140px; resize: none; padding: .65rem .9rem;
    border: 1px solid var(--line); border-radius: 22px; background: var(--surface); color: var(--ink);
    font: 16px/1.4 "Hanken Grotesk", system-ui, sans-serif;   /* 16 px = iPhone nezoomuje */
  }
  .as-form textarea:focus { outline: none; border-color: var(--clover); box-shadow: 0 0 0 3px rgba(110,138,78,.25); }
  .as-form button {
    width: 44px; height: 44px; flex: none; border: 0; border-radius: 50%; background: var(--forest); color: var(--cream);
    cursor: pointer; display: grid; place-items: center; touch-action: manipulation;
  }
  .as-form button:disabled { opacity: .45; cursor: default; }
  .as-form button:focus-visible { outline: 2px solid var(--clover); outline-offset: 2px; }
  .as-note { margin: 0; padding: .2rem 1rem .8rem; padding-bottom: max(.8rem, env(safe-area-inset-bottom)); font-size: .76rem; line-height: 1.4; color: var(--ink-soft); background: var(--cream); }
  .as-note a { color: inherit; }
  @media (min-width: 721px) {
    .as-form, .as-note { border-radius: 0; }
    .as-foot { border-left: 1px solid var(--line); border-right: 1px solid var(--line); }
  }
  @media (prefers-reduced-motion: reduce) { .as-dots i { animation: none; opacity: .6; } }
</style>
</head>
<body>
<header class="as-head">
  <img src="assets/logo.svg" alt="" width="32" height="32" />
  <h1>AI asistent</h1>
  <a class="as-x" id="zpet" href="/" aria-label="Zavřít chat a vrátit se na web">
    <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" aria-hidden="true"><path d="M6 6l12 12M18 6 6 18"/></svg>
  </a>
</header>

<main class="as-main">
  <div class="as-log" id="log" role="log" aria-live="polite">
    <div class="as-m bot">Dobrý den! Jsem AI asistent Jógy s králíčky. Zeptejte se na lekce, dárkový poukaz nebo cestu k nám. Na složitější věci vám rádi odpovíme osobně na <a href="mailto:info@jogaskralicky.cz">info@jogaskralicky.cz</a>.</div>
  </div>
  <div class="as-chips" id="chips"></div>
  <div class="as-foot">
    <form class="as-form" id="form">
      <textarea id="pole" rows="1" maxlength="500" placeholder="Napište dotaz…" aria-label="Váš dotaz" enterkeyhint="send"></textarea>
      <button type="submit" id="odeslat" aria-label="Odeslat"><svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M5 12h14M13 6l6 6-6 6"/></svg></button>
    </form>
    <p class="as-note">Odpovídá AI, může se splést. Nepište sem osobní ani zdravotní údaje, zprávy neukládáme. <a href="zasady-osobnich-udaju.html">Osobní údaje</a></p>
  </div>
</main>

<script defer src="/assets/asistent.js?v=1"></script>
</body>
</html>
