      - generic [ref=f7e293]:
        - generic [ref=f7e294]:
          - button "Musím už něco umět?" [ref=f7e295] [cursor=pointer]
          - paragraph [ref=f7e298]: Vůbec ne. Většina hostů přichází úplně bez zkušeností. Lektorka vše ukáže a nabídne jednodušší variantu každé polohy. Jde nám o klid, ne o dokonalý tvar.
        - generic [ref=f7e299]:
          - button "Nevyruší mě králíci od cvičení?" [ref=f7e300] [cursor=pointer]
          - paragraph [ref=f7e303]: To je celý smysl. Králík nečeká, až dokončíte pozici, jde si po svém a vy se tím pádem taky přestanete honit. Když se k vám zrovna žádný nepřiblíží, není to nic proti vám. Je to jeho rozhodnutí.
        - generic [ref=f7e304]:
          - button "Co když mám alergii na zvířata?" [ref=f7e305] [cursor=pointer]
          - paragraph [ref=f7e308]: Sál pečlivě větráme a čistíme, přesto při alergii na srst doporučujeme lekci zvážit nebo se poradit s lékařem. Rádi vám pomůžeme vybrat méně kontaktní termín.
        - generic [ref=f7e309]:
          - button "Co si mám vzít s sebou?" [ref=f7e310] [cursor=pointer]
          - paragraph [ref=f7e313]: Jen pohodlné oblečení a ponožky. Podložky, dečky i polštáře máme. Cvičíme bez bot a doporučujeme nepoužívat silné parfémy, králíci mají citlivý čich.
        - generic [ref=f7e314]:
          - button "Jak a kdy se platí?" [ref=f7e315] [cursor=pointer]
          - paragraph [ref=f7e318]: Výhradně online kartou při rezervaci, na místě se neplatí. Vstup stojí 499 Kč za osobu. Když rezervujete víc míst na jedno jméno, brána rovnou spočítá celou částku. Po zaplacení přijde e-mail s QR kódem, který ve studiu jen ukážete. Než platbu dokončíte, držíme vám místo 35 minut.
        - generic [ref=f7e319]:
          - button "Jsou králíci v pořádku?" [ref=f7e320] [cursor=pointer]
          - paragraph [ref=f7e323]: Jejich pohoda je u nás na prvním místě. Mají vlastní klidové zóny, kam se kdykoliv mohou stáhnout, pravidelné pauzy a veterinární péči. Na lekci jdou jen odpočatí a dobrovolně.
